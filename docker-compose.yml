services:
  trip-split:
    build: .
    ports:
      - '8080:8080'
    environment:
      APP_PASSCODE: ${APP_PASSCODE:?set APP_PASSCODE to a long owner passcode; travellers join with invite links}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - trip-split-data:/data
    restart: unless-stopped

volumes:
  trip-split-data:
